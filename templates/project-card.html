<div class="col-6 col-md-3">
    <div class="card portfolio-card">

        <a class="portfolio-card-image" href="./portfolio/{{slug}}.html">
            <img src="{{thumbnail}}" class="card-img-top" alt="{{title}}">
        </a>

        <div class="card-body px-0">
            <a class="btn btn-text btn-text-tight" href="./portfolio/{{slug}}.html">
                <span>{{title}}</span>
                <span class=" btn-text-arrow">
                    <span class="arrow arrow-right arrow-sm"></span>
                </span>
            </a>
            <p class="p-small">{{industry}}</p>
        </div>

    </div>
</div>
