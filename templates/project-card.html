<div class="portfolio-card-container col-6 col-md-3">

    <div class="portfolio-card-image">
        <img src="{{thumbnail}}" alt="{{title}}">
    </div>

    <div class="portfolio-card-item">

        <a class="btn btn-text" href="./portfolio/{{slug}}.html">

            <span>{{title}}</span>

            <span class="btn-text-arrow">
                <span class="arrow arrow-right arrow-sm"></span>
            </span>

        </a>

    </div>

</div>
