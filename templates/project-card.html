<div class="col-6 col-md-3 d-flex">
    <a class="card portfolio-card h-100 text-decoration-none" href="./portfolio/{{slug}}.html">
        <div class="portfolio-card-image">
            <img src="{{thumbnail}}" class="card-img-top" alt="{{title}}">
        </div>

        <div class="card-body px-0 d-flex flex-column">
            <span class="btn btn-text btn-text-tight">
                <span>{{title}}</span>
                <span class="btn-text-arrow">
                    <span class="arrow arrow-right arrow-sm"></span>
                </span>
            </span>
            <p class="p-small mt-auto">{{industry}}</p>
        </div>
    </a>
</div>
